{% extends "base.html" %}
{% block title %}新規登録{% endblock %}
{% block content %}
<div class="auth card">
  <h1>新規登録</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary btn-block">登録する</button>
  </form>
  <p class="muted">アカウントをお持ちの方は <a href="{% url 'login' %}">ログイン</a></p>
</div>
{% endblock %}
