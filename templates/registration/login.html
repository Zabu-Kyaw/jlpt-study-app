{% extends "base.html" %}
{% block title %}ログイン{% endblock %}
{% block content %}
<div class="auth card">
  <h1>ログイン</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary btn-block">ログイン</button>
  </form>
  <p class="muted">初めての方は <a href="{% url 'signup' %}">新規登録</a></p>
</div>
{% endblock %}
