<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}JLPT Study{% endblock %}</title>
  <style>
    body { font-family: system-ui, "Noto Sans JP", sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .big { font-size: 2rem; margin: 1rem 0; }
    .choice { display: block; margin: .5rem 0; padding: .75rem; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; }
    .correct { color: #1a7f37; }
    .wrong { color: #cf222e; }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin: 1rem 0 2rem; }
    .stat { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; text-align: center; }
    .num { display: block; font-size: 2rem; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>
    <nav>
    <div>
      <a href="{% url 'deck_list' %}">デッキ</a> ·
      <a href="{% url 'dashboard' %}">ダッシュボード</a>
    </div>
    {% if user.is_authenticated %}
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>ログアウト</button></form>
    {% endif %}
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
