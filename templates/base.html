{% load static %}
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}JLPT Study{% endblock %}</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a class="brand" href="{% url 'deck_list' %}">📚 JLPT Study</a>
      <nav class="nav-links">
        {% if user.is_authenticated %}
          <a href="{% url 'deck_list' %}" {% if request.resolver_match.url_name == 'deck_list' %}class="active"{% endif %}>デッキ</a>
          <a href="{% url 'dashboard' %}" {% if request.resolver_match.url_name == 'dashboard' %}class="active"{% endif %}>ダッシュボード</a>
          <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="linklike">ログアウト</button></form>
        {% endif %}
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="テーマを切り替え" title="ライト / ダーク">🌙</button>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="muted">
    語彙データ：<a href="https://www.tanos.co.uk/jlpt/">Jonathan Waller (tanos.co.uk)</a>, CC BY ／
    意味：<a href="https://www.edrdg.org/jmdict/j_jmdict.html">JMdict</a> © EDRDG, CC BY-SA 4.0
  </footer>

  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById("theme-toggle");

      function render() {
        var dark = root.getAttribute("data-theme") === "dark";
        btn.textContent = dark ? "☀️" : "🌙";
        btn.setAttribute("aria-pressed", dark ? "true" : "false");
      }

      btn.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
        render();
      });

      render();
    })();
  </script>
</body>
</html>
