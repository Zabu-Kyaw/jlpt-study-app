name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jlpt
          POSTGRES_PASSWORD: jlpt
          POSTGRES_DB: jlpt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jlpt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://jlpt:jlpt@localhost:5432/jlpt
      SECRET_KEY: ci-only-secret
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest